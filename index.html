<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Denim Store - Pantalones</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Encabezado -->
  <header class="navbar">
    <div class="logo">DENIM STORE</div>
    <nav>
      <a href="hombres.html">Hombres</a>
      <a href="mujeres.html">Mujeres</a>
      <a href="#registro">Registro</a>
    </nav>
  </header>

  <!-- Entrada llamativa (Hero) -->
  <section class="hero">
    <div class="hero-content">
      <h1>ESTILO & ACTITUD</h1>
      <p>Encuentra el fit perfecto para tu día a día</p>
      <div class="hero-buttons">
        <a href="hombres.html" class="btn btn-primary">Pantalones Hombre</a>
        <a href="mujeres.html" class="btn btn-secondary">Pantalones Mujer</a>
      </div>
    </div>
  </section>

  <!-- Categorías Principales -->
  <section class="container categorias">
    <h2>Explora las Colecciones</h2>
    <div class="grid-categorias">
      <a href="hombres.html" class="card-categoria cat-hombre">
        <h3>Hombres</h3>
      </a>
      <a href="mujeres.html" class="card-categoria cat-mujer">
        <h3>Mujeres</h3>
      </a>
    </div>
  </section>

  <!-- Sección donde tu compañero pegará su Formulario de Registro -->
  <section id="registro" class="container">
    <!-- Tu compañero inserta aquí su formulario estilo fit.gt -->
  </section>

  <script src="script.js"></script>
</body>
</html>
